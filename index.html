<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Muhammad Faisal Hameed · Game Developer & Interactive 3D Programmer</title>
  <meta name="description" content="Interactive 3D portfolio of Muhammad Faisal Hameed: game developer (Unreal Engine 5, Unity, Three.js) from Karachi, Pakistan." />
  <meta name="theme-color" content="#14202b" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2314202b'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23e8b25a' font-family='Georgia' font-weight='700'>F</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body data-tier="full" data-theme="dusk">
  <a class="skip" href="#content">Skip to content</a>

  <!-- 3D stage (created by main.js unless tier = basic) -->
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- HUD -->
  <header class="hud" id="hud">
    <button class="chip brand" id="brandChip" aria-label="Muhammad Faisal Hameed">MFH</button>
    <div class="chips right">
      <button class="chip" id="soundChip" aria-pressed="false" aria-label="Sound">♪ off</button>
      <button class="chip" id="menuChip" aria-haspopup="dialog" aria-label="Open menu">☰ Menu</button>
    </div>
  </header>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sheet" id="menuSheet" role="dialog" aria-label="Menu" hidden>
    <div class="sheet-box">
      <div class="sheet-head"><b>Go to a floor</b><button id="sheetClose" aria-label="Close menu">×</button></div>
      <div class="sheet-grid">
        <button data-go="about">1 · About</button><button data-go="journey">2 · Journey</button><button data-go="projects">3 · Projects</button><button data-go="skills">4 · Skills</button>
        <button data-go="achievements">5 · Trophies</button><button data-go="roof">Roof</button><button data-go="lobby">Lobby</button><button data-go="contact">Contact</button>
      </div>
      <div class="sheet-head"><b>View</b></div>
      <div class="sheet-grid three"><button id="readBtn">📄 Read as a page</button><button data-go="promo">▶ Promo video</button><button data-go="credits">Credits</button></div>
      <div class="sheet-head"><b>Quality</b></div>
      <div class="sheet-grid three"><button data-tier="full">Full</button><button data-tier="lite">Lite</button><button data-tier="auto">Auto</button></div>
    </div>
  </div>

  <!-- Landing -->
  <section class="title landing" id="home" aria-label="Start">
    <div class="title-inner">
      <p class="eyebrow">Game developer · interactive 3D</p>
      <h1>Muhammad<br />Faisal Hameed</h1>
      <p class="lead" id="tagline"></p>
      <div class="menu">
        <button class="menu-btn primary" id="startBtn">Enter the tower</button>
        <button class="menu-btn" id="plainBtn">Read as a page</button>
      </div>
    </div>
  </section>

  <!-- Content panels (real HTML, readable without 3D) -->
  <main id="content" tabindex="-1">
    <section class="panel" id="about" data-panel hidden></section>
    <section class="panel" id="skills" data-panel hidden></section>
    <section class="panel wide" id="projects" data-panel hidden></section>
    <section class="panel" id="journey" data-panel hidden></section>
    <section class="panel" id="achievements" data-panel hidden></section>
    <section class="panel" id="promo" data-panel hidden></section>
    <section class="panel" id="contact" data-panel hidden></section>
    <section class="panel" id="credits" data-panel hidden></section>
  </main>

  <!-- Chotu -->
  <div id="chotu" class="chotu" hidden>
    <button class="chotu-btn" id="chotuBtn" aria-label="Chat with Chotu, the portfolio assistant"><svg class="snake" viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"><path d="M8 34c0-6 6-8 12-8s12-2 12-8-6-8-12-8" fill="none" stroke="#f3ead8" stroke-width="6" stroke-linecap="round"/><path d="M8 34c0-6 6-8 12-8s12-2 12-8-6-8-12-8" fill="none" stroke="#d9a441" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/><ellipse cx="20" cy="10" rx="7" ry="5" fill="#f3ead8"/><circle cx="23" cy="8.5" r="1.4" fill="#22160d"/><path d="M27 11l5 1-2 1 2 1-5-1" fill="#c8553d"/></svg></button>
    <div class="chat" id="chat" role="dialog" aria-label="Chat with Chotu" hidden>
      <div class="chat-head"><b>Chotu</b><span>answers only from my portfolio</span><button id="speakBtn" class="ic" aria-pressed="false" aria-label="Read answers aloud" title="Read answers aloud" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button><button id="chatClose" aria-label="Close chat">×</button></div>
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <form class="chat-form" id="chatForm"><input id="chatInput" maxlength="300" placeholder="Ask about projects, skills, experience…" autocomplete="off" aria-label="Your question" /><button type="button" id="micBtn" class="ic" aria-label="Ask by voice" title="Ask by voice" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button><button>Send</button></form>
      <details class="rag"><summary>How Chotu works</summary><div id="ragInfo"></div></details>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true"><button id="lbClose" aria-label="Close">×</button><div id="lbBody"></div></div>
  <div class="loader" id="loader" role="status"><div class="bar"><i id="loadBar"></i></div><p id="loadMsg">Building the tower…</p></div>

  <script type="module" src="/src/main.js"></script>
  <noscript><p style="padding:2rem;color:#fff">This portfolio needs JavaScript. Email: hameedfaisal24@gmail.com · GitHub: github.com/hameed-F</p></noscript>
</body>
</html>
