<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Muhammad Faisal Hameed · Game Developer & Interactive 3D Programmer</title>
  <meta name="description" content="Interactive 3D portfolio of Muhammad Faisal Hameed, a game developer (Unreal Engine 5, Unity, Three.js) from Karachi, Pakistan. Explore a life-size Snakes & Ladders board." />
  <meta name="theme-color" content="#0a0f26" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d2540'/><rect x='7' y='7' width='18' height='18' rx='4' fill='%23fbf3e2'/><circle cx='12' cy='12' r='2' fill='%231d2540'/><circle cx='20' cy='20' r='2' fill='%231d2540'/><circle cx='16' cy='16' r='2' fill='%23c2503e'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body data-theme="light" data-tier="full" data-mode="loading">
  <a class="skip" href="#page">Skip to the text version</a>
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- Loader: a folded board that unfolds as the files arrive -->
  <div id="loader" role="status" aria-live="polite">
    <div class="ld-in">
      <p class="ld-kicker">Muhammad Faisal Hameed</p>
      <h1 class="ld-title">Snakes &amp; Ladders</h1>
      <div class="fold-stage" aria-hidden="true"><div class="fold" id="fold">
        <div class="fp"><div class="face front"></div><div class="face back"></div>
          <div class="fp"><div class="face front"></div><div class="face back"></div>
            <div class="fp"><div class="face front"></div><div class="face back"></div>
              <div class="fp"><div class="face front"></div><div class="face back"></div></div></div></div></div>
      </div></div>
      <p class="ld-pct"><b id="ldPct">0</b>%</p>
      <p class="ld-msg" id="ldMsg">folding things out…</p>
      <button class="ld-page" id="ldPage" type="button">Read it as a page instead</button>
    </div>
  </div>

  <header class="hud" id="hud" hidden>
    <button class="chip brand" id="brandChip" type="button" aria-label="Back to the board">MFH</button>
    <div class="chips">
      <button class="chip" id="themeChip" type="button" aria-pressed="false" aria-label="Switch to dark mode (glowing snakes)"><span class="ic" aria-hidden="true">☾</span><span class="lbl">Dark</span></button>
      <button class="chip" id="menuChip" type="button" aria-haspopup="dialog" aria-label="Open menu"><span class="ic" aria-hidden="true">☰</span><span class="lbl">Menu</span></button>
    </div>
  </header>

  <!-- floating call to action (Next / Skip) -->
  <div class="cta" id="cta" hidden>
    <button class="btn big" id="nextBtn" type="button"></button>
    <button class="btn ghost" id="skipBtn" type="button" hidden>Skip</button>
  </div>
  <div class="sub-hint" id="hint" hidden></div>

  <!-- section screens are mounted here by story.js -->
  <section id="scr" class="scr" hidden aria-live="polite"></section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="sheet" id="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="sheet-box">
      <div class="sheet-head"><b>Go to a tile</b><button id="menuClose" type="button" aria-label="Close menu">×</button></div>
      <div class="sheet-grid" id="menuGrid"></div>
      <div class="sheet-head"><b>Settings</b></div>
      <div class="sheet-grid two">
        <button type="button" id="mTheme">Dark / light</button>
        <button type="button" id="mRead">Read as a page</button>
        <button type="button" data-tier="full">Quality: Full</button>
        <button type="button" data-tier="lite">Quality: Lite</button>
        <button type="button" data-tier="auto">Quality: Auto</button>
        <button type="button" data-go="credits">Credits</button>
      </div>
    </div>
  </div>

  <!-- the dice companion's chat -->
  <div class="chat" id="chat" role="dialog" aria-label="Chat with Pappu Pansa" hidden>
    <div class="chat-head"><div><b id="botName">Pappu Pansa</b><span>the dice. Ask in English or Urdu (اردو)</span></div>
      <select id="chatLang" aria-label="Voice language"><option value="auto">Auto</option><option value="en-US">English</option><option value="ur-PK">اردو</option></select>
      <button id="speakBtn" class="ic-btn" type="button" aria-pressed="false" aria-label="Read answers aloud" hidden>🔊</button>
      <button id="chatClose" class="ic-btn" type="button" aria-label="Close chat">×</button></div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-chips" id="chatChips"></div>
    <form class="chat-form" id="chatForm"><input id="chatInput" maxlength="300" placeholder="Ask anything about Faisal…" autocomplete="off" aria-label="Your question" /><button type="button" id="micBtn" class="ic-btn" aria-label="Ask by voice" hidden>🎤</button><button class="btn" type="submit">Send</button></form>
    <details class="rag"><summary>How it works</summary><div id="ragInfo"></div></details>
  </div>
  <button class="chat-fab" id="chatFab" type="button" aria-label="Chat with Pappu Pansa, the dice companion" hidden><span class="fab-dice" aria-hidden="true"></span><span class="lbl">Ask me</span></button>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true"><button id="lbClose" type="button" aria-label="Close">×</button><div id="lbBody"></div></div>

  <!-- Text version: the same content as plain HTML (no 3D needed, screen-reader friendly) -->
  <main id="page" tabindex="-1" hidden></main>

  <script type="module" src="/src/main.js"></script>
  <noscript><p style="padding:2rem;color:#fff">This portfolio needs JavaScript. Email: hameedfaisal24@gmail.com · GitHub: github.com/hameed-F</p></noscript>
</body>
</html>
